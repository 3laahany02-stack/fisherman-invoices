    --brand-ink:#0A4F44;
    --amber:#B8813A;
    --slate:#3E5C76;
    --brick:#A23B32;
    --danger:#B3261E;
    --ok:#0E6B5C;
    --radius:16px;
    --radius-sm:10px;
    --shadow:0 2px 10px rgba(30,38,33,0.06), 0 1px 2px rgba(30,38,33,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:Tahoma,'Segoe UI',Arial,sans-serif;
    min-height:100vh;
    padding-bottom:40px;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 16px;}

  /* Top bar */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:var(--bg);
    padding:14px 16px 10px;
    display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid var(--line);
  }
  .shopname{
    font-weight:800;font-size:19px;color:var(--brand-ink);
    background:transparent;border:none;outline:none;
    padding:4px 2px;max-width:100%;
    border-bottom:1px dashed transparent;
  }
  .shopname:focus{border-bottom:1px dashed var(--brand);}
  .topbar-brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;}
  .topbar-logo{height:42px;width:auto;max-width:60px;object-fit:contain;border-radius:8px;flex:0 0 auto;}
  .icon-btn{
    display:flex;align-items:center;gap:6px;
    background:var(--surface);border:1px solid var(--line);
    border-radius:999px;padding:8px 14px;font-family:inherit;
    font-weight:600;font-size:13px;color:var(--ink);cursor:pointer;
    box-shadow:var(--shadow);
  }
  .icon-btn:active{transform:scale(0.97);}

  section{padding:16px 0;}
  h2.section-title{
    font-size:13px;font-weight:700;color:var(--ink-soft);
    margin:0 0 10px;letter-spacing:.3px;
  }

  /* Type selector */
  .type-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .type-card{
    border:2px solid var(--line);background:var(--surface);
    border-radius:var(--radius);padding:14px 10px;
    text-align:center;cursor:pointer;user-select:none;
    transition:all .15s ease;
  }
  .type-card .t-label{font-weight:800;font-size:15px;display:block;}
  .type-card .t-sub{font-size:11px;color:var(--ink-soft);display:block;margin-top:2px;}
  .type-card[data-active="true"]{color:#fff;border-color:transparent;}
  .type-card[data-type="sale"][data-active="true"]{background:var(--brand);}
  .type-card[data-type="purchase"][data-active="true"]{background:var(--amber);}
  .type-card[data-type="transfer"][data-active="true"]{background:var(--slate);}
  .type-card[data-type="return"][data-active="true"]{background:var(--brick);}
  .type-card[data-active="true"] .t-sub{color:rgba(255,255,255,0.85);}

  .card{
    background:var(--surface);border-radius:var(--radius);
    padding:16px;box-shadow:var(--shadow);
  }
  .field{margin-bottom:12px;}
  .field:last-child{margin-bottom:0;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%;border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:10px 12px;font-family:inherit;font-size:15px;color:var(--ink);
    background:#FBFCFA;outline:none;
  }
  .field input:focus, .field select:focus{border-color:var(--brand);}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  /* Items */
  .item-row{
    background:var(--surface);border-radius:var(--radius);
    padding:14px;box-shadow:var(--shadow);margin-bottom:10px;
    position:relative;
  }
  .item-row .remove-btn{
    position:absolute;top:10px;left:10px;
    width:26px;height:26px;border-radius:50%;
    background:#F5EDEC;color:var(--danger);border:none;
    font-size:15px;font-weight:700;cursor:pointer;line-height:1;
  }
  .item-row .product-select{margin-bottom:10px;}
  .fields-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;}
  .fields-row.fields-row-2{grid-template-columns:1fr 1fr;}
  .fr-col label{font-size:10.5px;color:var(--ink-soft);font-weight:600;display:block;margin-bottom:5px;text-align:center;}
  .unit-toggle{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;height:38px;}
  .unit-toggle button{
    flex:1;border:none;background:#FBFCFA;font-family:inherit;font-weight:700;
    font-size:11px;cursor:pointer;color:var(--ink-soft);padding:0 2px;
  }
  .unit-toggle button[data-active="true"]{background:var(--brand);color:#fff;}
  .qty-box{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;height:38px;overflow:hidden;}
  .qty-box button{
    width:26px;height:100%;flex:0 0 26px;border:none;background:#F0F3EE;font-size:15px;
    font-weight:700;color:var(--brand-ink);cursor:pointer;
  }
  .qty-box input{
    width:100%;min-width:0;border:none;text-align:center;font-family:inherit;
    font-weight:700;font-size:13px;background:transparent;outline:none;
  }
  .fr-col.price-col label{color:var(--brand-ink);}
  .fr-col .price-input{
    width:100%;height:38px;border:2px solid var(--brand);border-radius:999px;
    padding:0 6px;text-align:center;font-family:inherit;font-weight:700;font-size:13px;
    background:#FFFFFF;color:var(--brand-ink);
  }
  .fr-col .price-input:focus{outline:none;border-color:var(--brand-ink);background:#F3FAF8;}
  .fr-col .line-total-input{
    width:100%;height:38px;border:1px dashed var(--line);border-radius:999px;
    padding:0 6px;text-align:center;font-family:inherit;font-weight:700;font-size:13px;
    background:#F0F1EE;color:var(--ink-soft);
  }

  .add-item-btn{
    width:100%;padding:13px;border-radius:var(--radius);
    border:2px dashed var(--line);background:transparent;
    font-family:inherit;font-weight:700;font-size:14px;color:var(--brand-ink);
    cursor:pointer;margin-top:2px;
  }
  .add-item-btn:active{background:#EEF3EC;}

  /* Totals / payments */
  .total-line{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;}
  .total-line.grand{border-top:1px dashed var(--line);margin-top:6px;padding-top:12px;}
  .total-line .label{color:var(--ink-soft);font-size:14px;font-weight:600;}
  .total-line.grand .label{color:var(--ink);font-size:15px;font-weight:800;}
  .total-line .val{font-weight:800;font-size:16px;}
  .total-line.grand .val{font-size:22px;color:var(--brand-ink);}

  .quick-pay-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px;}
  .quick-pay-btn{
    padding:11px 4px;border-radius:999px;border:2px solid var(--line);
    background:#fff;font-family:inherit;font-weight:700;font-size:12.5px;
    color:var(--ink);cursor:pointer;
  }
  .quick-pay-btn[data-active="true"]{background:var(--brand);border-color:var(--brand);color:#fff;}
  .pay-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px;}
  .pay-field label{font-size:11px;font-weight:700;color:var(--ink-soft);display:block;margin-bottom:5px;text-align:center;}
  .pay-field input{
    width:100%;border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:9px 6px;text-align:center;font-family:inherit;font-weight:700;
    font-size:14px;background:#FBFCFA;
  }
  .match-banner{
    margin-top:12px;padding:10px 12px;border-radius:var(--radius-sm);
    font-size:13px;font-weight:700;text-align:center;
  }
  .match-banner.ok{background:#E7F3EF;color:var(--brand-ink);}
  .match-banner.bad{background:#FBEDEC;color:var(--danger);}

  .action-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;}
  .btn{
    padding:14px;border-radius:999px;border:none;font-family:inherit;
    font-weight:800;font-size:15px;cursor:pointer;text-align:center;
  }
  .btn-primary{background:var(--brand);color:#fff;}
  .btn-primary:disabled{background:#C6D4CC;color:#8A968E;cursor:not-allowed;}
  .btn-ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);}

  /* Invoice list */
  .inv-card{
    background:var(--surface);border-radius:var(--radius);padding:14px;
    box-shadow:var(--shadow);margin-bottom:10px;display:flex;
    align-items:center;gap:12px;cursor:pointer;
  }
  .inv-badge{
    width:6px;align-self:stretch;border-radius:4px;flex:0 0 6px;
  }
  .inv-badge.sale{background:var(--brand);}
  .inv-badge.purchase{background:var(--amber);}
  .inv-badge.transfer{background:var(--slate);}
  .inv-badge.return{background:var(--brick);}
  .inv-info{flex:1;}
  .inv-info .top{display:flex;justify-content:space-between;font-weight:800;font-size:14px;}
  .inv-info .bottom{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-top:3px;}
  .empty-state{text-align:center;color:var(--ink-soft);padding:40px 20px;font-size:14px;}

  /* Receipt (share) view */
  .receipt-outer{padding:20px 0;}
  #receipt{
    background:#fff;border-radius:4px;padding:24px 20px 20px;
    position:relative;overflow:hidden;
    box-shadow:var(--shadow);
  }
  #receipt::before, #receipt::after{
    content:"";position:absolute;left:0;right:0;height:14px;
    background-image:radial-gradient(circle 7px, var(--bg) 7px, transparent 8px);
    background-size:24px 14px;background-repeat:repeat-x;
  }
  #receipt::before{top:-7px;}
  #receipt::after{bottom:-7px;background-position:12px 0;}
  .r-shop{font-size:20px;font-weight:900;color:var(--brand-ink);text-align:center;}
  .r-logo{display:block;max-width:220px;max-height:150px;margin:0 auto 6px;object-fit:contain;}
  .r-type-badge{
    display:inline-block;margin:8px auto 4px;padding:5px 16px;border-radius:999px;
    font-size:12px;font-weight:800;color:#fff;
  }
  .r-type-badge.sale{background:var(--brand);}
  .r-type-badge.purchase{background:var(--amber);}
  .r-type-badge.transfer{background:var(--slate);}
  .r-type-badge.return{background:var(--brick);}
  .r-center{text-align:center;}
  .r-meta{
    display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);
    border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);
    padding:10px 0;margin:12px 0;
  }
  .r-party{font-size:13px;font-weight:700;margin-bottom:12px;}
  table.r-table{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.r-table th{
    text-align:right;color:var(--ink-soft);font-weight:700;font-size:11px;
    padding-bottom:6px;border-bottom:1px solid var(--line);
  }
  table.r-table td{padding:7px 0;border-bottom:1px solid #F0F1EE;font-weight:600;}
  table.r-table td.num, table.r-table th.num{text-align:left;}
  .r-totals{margin-top:12px;}
  .r-totals .row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;color:var(--ink-soft);}
  .r-totals .row.grand{font-size:17px;font-weight:900;color:var(--brand-ink);border-top:1px dashed var(--line);margin-top:6px;padding-top:8px;}
  .r-footer{text-align:center;font-size:11px;color:var(--ink-soft);margin-top:16px;}

  .hidden{display:none !important;}
  .search-wrap{position:relative;}
  .search-results{
    position:absolute;top:100%;right:0;left:0;z-index:30;
    background:#fff;border:1px solid var(--line);border-radius:var(--radius-sm);
    box-shadow:var(--shadow);max-height:220px;overflow-y:auto;margin-top:4px;
  }
  .search-results .opt{padding:10px 12px;font-size:14px;cursor:pointer;display:flex;justify-content:space-between;}
  .search-results .opt:hover{background:#F0F3EE;}
  .search-results .opt .p{color:var(--ink-soft);font-size:12px;}
  .toast{
    position:fixed;bottom:20px;right:50%;transform:translateX(50%);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;
    font-size:13px;font-weight:700;z-index:100;box-shadow:var(--shadow);
  }
</style>
</head>

<script>
/* توافق مع الاستضافة برا كلود: لو window.storage مش موجودة (يعني الصفحة شغالة
   كملف عادي أو على استضافة زي GitHub Pages)، نستخدم localStorage بنفس الشكل
   عشان الحفظ يفضل شغال بالظبط زي ما هو. */
if (!window.storage) {
  window.storage = {
    async get(key, shared){
      const raw = localStorage.getItem((shared?'shared:':'local:') + key);
      if(raw === null) throw new Error('key not found');
      return {key, value: raw, shared: !!shared};
    },
    async set(key, value, shared){
      localStorage.setItem((shared?'shared:':'local:') + key, value);
      return {key, value, shared: !!shared};
    },
    async delete(key, shared){
      localStorage.removeItem((shared?'shared:':'local:') + key);
      return {key, deleted:true, shared: !!shared};
    },
    async list(prefix, shared){
      const p = (shared?'shared:':'local:') + (prefix||'');
      const keys = Object.keys(localStorage)
        .filter(k=> k.startsWith(p))
        .map(k=> k.slice(shared?7:6));
      return {keys, prefix, shared: !!shared};
    }
  };
}

const TYPES = [
  {key:"sale", label:"بيع", sub:"فاتورة بيع", partyLabel:"اسم العميل", prefix:"ب"},
  {key:"purchase", label:"شراء", sub:"فاتورة شراء", partyLabel:"اسم المورد", prefix:"ش"},
  {key:"transfer", label:"تحويل مخزن", sub:"نقل بضاعة", partyLabel:"", prefix:"تح"},
  {key:"return", label:"مرتجع", sub:"إرجاع بضاعة", partyLabel:"اسم العميل", prefix:"مر"},
];

/* ================= STATE ================= */
let state = {
  type: "sale",
  party: "",
  fromStore: "",
  toStore: "",
  note: "",
  items: [], // {rowId, productId, unit:'piece'|'dozen', qty, price}
  pay: {vodafone:0, cash:0, credit:0}
};
let rowSeq = 1;
let currentReceiptInvoiceId = null;

/* ================= STORAGE HELPERS ================= */
async function loadShopName(){
  try{
    const r = await window.storage.get('shop-settings', false);
    if(r && r.value){
      const s = JSON.parse(r.value);
      document.getElementById('shopNameInput').value = s.name || "";
    }
  }catch(e){ /* not set yet */ }
}
async function saveShopName(name){
  try{ await window.storage.set('shop-settings', JSON.stringify({name}), false); }catch(e){}
}
async function nextInvoiceNumber(type){
  let counters = {sale:0,purchase:0,transfer:0,return:0};
  try{
    const r = await window.storage.get('invoice-counter', false);
    if(r && r.value) counters = JSON.parse(r.value);
  }catch(e){}
  counters[type] = (counters[type]||0) + 1;
  try{ await window.storage.set('invoice-counter', JSON.stringify(counters), false); }catch(e){}
  return counters[type];
}
async function saveInvoiceToStorage(invoice){
  try{
    await window.storage.set('invoice:'+invoice.id, JSON.stringify(invoice), false);
    return true;
  }catch(e){ return false; }
}
async function listInvoices(){
  try{
    const r = await window.storage.list('invoice:', false);
    if(!r || !r.keys) return [];
    const out = [];
    for(const k of r.keys){
      try{
        const rec = await window.storage.get(k, false);
        if(rec && rec.value) out.push(JSON.parse(rec.value));
      }catch(e){}
    }
    out.sort((a,b)=> b.createdAt - a.createdAt);
    return out;
  }catch(e){ return []; }
}
async function deleteInvoiceFromStorage(id){
  try{ await window.storage.delete('invoice:'+id, false); }catch(e){}
}
async function saveDraft(){
  try{ await window.storage.set('draft-invoice', JSON.stringify({state, rowSeq}), false); }catch(e){}
}
async function loadDraft(){
  try{
    const r = await window.storage.get('draft-invoice', false);
    if(r && r.value) return JSON.parse(r.value);
  }catch(e){}
  return null;
}
async function clearDraft(){
  try{ await window.storage.delete('draft-invoice', false); }catch(e){}
}

/* ================= UTIL ================= */
function fmt(n){
  n = Math.round((n + Number.EPSILON) * 100) / 100;
  return n.toLocaleString('ar-EG');
}
function typeMeta(key){ return TYPES.find(t=>t.key===key); }
function lineTotal(item){ return (item.qty||0) * (item.price||0); }
function grandTotal(){ return state.items.reduce((s,it)=> s + lineTotal(it), 0); }
function paySum(){ return (Number(state.pay.vodafone)||0) + (Number(state.pay.cash)||0) + (Number(state.pay.credit)||0); }

function unitPrice(product, unit){
  // السعر ثابت بغض النظر عن الوحدة (قطعة أو دستة) — إلغاء ضرب الدستة في 12 بناءً على طلبك
  return product.price;
}

/* ================= RENDER: TYPE SELECTOR ================= */
function renderTypeGrid(){
  const grid = document.getElementById('typeGrid');
  grid.innerHTML = "";
  TYPES.forEach(t=>{
    const el = document.createElement('div');
    el.className = 'type-card';
    el.dataset.type = t.key;
    el.dataset.active = (state.type === t.key) ? "true" : "false";
    el.innerHTML = `<span class="t-label">${t.label}</span><span class="t-sub">${t.sub}</span>`;
    el.addEventListener('click', ()=>{ state.type = t.key; renderTypeGrid(); renderPartyCard(); renderItems(); toggleTotalsSection(); updateTotals(); });
    grid.appendChild(el);
  });
}

/* ================= RENDER: PARTY CARD ================= */
function renderPartyCard(){
  const card = document.getElementById('partyCard');
  const title = document.getElementById('partyTitle');
  const t = typeMeta(state.type);
  if(state.type === 'transfer'){
    title.textContent = "بيانات التحويل";
    card.innerHTML = `
      <div class="two-col">
        <div class="field"><label>من مخزن</label><input id="fromStoreInput" value="${state.fromStore||""}" placeholder="مثال: المخزن الرئيسي"></div>
        <div class="field"><label>إلى مخزن</label><input id="toStoreInput" value="${state.toStore||""}" placeholder="مثال: فرع..."></div>
      </div>
      <div class="field"><label>ملاحظات (اختياري)</label><input id="noteInput" value="${state.note||""}"></div>
    `;
    document.getElementById('fromStoreInput').addEventListener('input', e=>{ state.fromStore = e.target.value; saveDraft(); });
    document.getElementById('toStoreInput').addEventListener('input', e=>{ state.toStore = e.target.value; saveDraft(); });
    document.getElementById('noteInput').addEventListener('input', e=>{ state.note = e.target.value; saveDraft(); });
  } else {
    title.textContent = "بيانات الفاتورة";
    card.innerHTML = `
      <div class="field"><label>${t.partyLabel}</label><input id="partyInput" value="${state.party||""}" placeholder="اختياري"></div>
      <div class="field"><label>ملاحظات (اختياري)</label><input id="noteInput" value="${state.note||""}"></div>
    `;
    document.getElementById('partyInput').addEventListener('input', e=>{ state.party = e.target.value; saveDraft(); });
    document.getElementById('noteInput').addEventListener('input', e=>{ state.note = e.target.value; saveDraft(); });
  }
}

/* ================= RENDER: ITEMS ================= */

  state.items.push({rowId: rowSeq++, productId:null, unit:'piece', qty:1, price:0});
  renderItems();
  updateTotals();
}

  state.items = state.items.filter(it=>it.rowId!==rowId);

  updateTotals();
}

          <div class="qty-box" data-row="${item.rowId}">
            <button type="button" class="qty-dec">−</button>
            <input type="number" class="qty-input" inputmode="numeric" value="${item.qty}">
            <button type="button" class="qty-inc">+</button>
          </div>
        </div>
        <div class="fr-col price-col">
          <label>السعر</label>
          <input type="number" inputmode="decimal" class="price-input" data-row="${item.rowId}" value="${item.price}">
        </div>
        <div class="fr-col">
          <label>الإجمالي</label>
          <input type="text" class="line-total-input" disabled value="${fmt(lineTotal(item))}">
        </div>
      </div>
    `;
    row.innerHTML = `
      <button class="remove-btn" data-row="${item.rowId}">×</button>
      <div class="field product-select">
        <label>الصنف</label>
        <div class="search-wrap">
          <input type="text" class="prod-search" data-row="${item.rowId}"
            placeholder="اكتب اسم الصنف..." value="${product ? product.name : ""}" autocomplete="off">
          <div class="search-results hidden" data-row="${item.rowId}"></div>
        </div>
      </div>
      ${fieldsRowHtml}
    `;
    wrap.appendChild(row);
  });
  bindItemEvents();
}
function bindItemEvents(){
  document.querySelectorAll('.remove-btn').forEach(b=>{
    b.onclick = ()=> removeItemRow(Number(b.dataset.row));
  });
  document.querySelectorAll('.prod-search').forEach(inp=>{
    const rowId = Number(inp.dataset.row);
    const resultsBox = document.querySelector(`.search-results[data-row="${rowId}"]`);
    function showMatches(q){
      const list = q ? PRODUCTS.filter(p=> p.name.includes(q)) : PRODUCTS;
      if(list.length===0){ resultsBox.classList.add('hidden'); resultsBox.innerHTML=""; return; }
      resultsBox.innerHTML = list.map(m=> `<div class="opt" data-row="${rowId}" data-pid="${m.id}"><span>${m.name}</span><span class="p">${fmt(m.price)}</span></div>`).join("");
      resultsBox.classList.remove('hidden');
      resultsBox.querySelectorAll('.opt').forEach(o=>{
        o.onclick = ()=>{
          const item = state.items.find(it=>it.rowId===rowId);
          const product = PRODUCTS.find(p=>p.id===Number(o.dataset.pid));
          item.productId = product.id;
          item.price = unitPrice(product, item.unit); // السعر بيتحسب أوتوماتيك حسب الوحدة
          renderItems();
          updateTotals();
        };
      });
    }
    inp.oninput = ()=> showMatches(inp.value.trim());
    inp.onfocus = ()=>{ inp.select(); showMatches(inp.value.trim()); };
    inp.onblur = ()=> setTimeout(()=> resultsBox.classList.add('hidden'), 150);
  });
  document.querySelectorAll('.unit-toggle button').forEach(btn=>{
    btn.onclick = ()=>{
      const rowId = Number(btn.parentElement.dataset.row);
      const item = state.items.find(it=>it.rowId===rowId);
      item.unit = btn.dataset.unit;
      // السعر ثابت ومبيتغيرش لما تبدّل الوحدة — القطعة والدستة بنفس السعر المحطوط
      renderItems();
      updateTotals();
    };
  });
  document.querySelectorAll('.qty-box').forEach(box=>{
    const rowId = Number(box.dataset.row);
    const item = state.items.find(it=>it.rowId===rowId);
    box.querySelector('.qty-dec').onclick = ()=>{ item.qty = Math.max(0, (Number(item.qty)||0) - 1); renderItems(); updateTotals(); };
    box.querySelector('.qty-inc').onclick = ()=>{ item.qty = (Number(item.qty)||0) + 1; renderItems(); updateTotals(); };
    const qtyInput = box.querySelector('.qty-input');
    qtyInput.oninput = (e)=>{ item.qty = Number(e.target.value)||0; updateTotals(); refreshLineTotalOnly(rowId); };
    qtyInput.onfocus = (e)=> e.target.select(); // يحدد الرقم كله عشان تكتب فوقه على طول من غير ما تمسحه
  });
  document.querySelectorAll('.price-input').forEach(inp=>{
    inp.oninput = ()=>{
      const rowId = Number(inp.dataset.row);
      const item = state.items.find(it=>it.rowId===rowId);
      item.price = Number(inp.value)||0;
      updateTotals();
      refreshLineTotalOnly(rowId);
    };
    inp.onfocus = (e)=> e.target.select(); // يحدد الرقم كله عشان تكتب فوقه على طول من غير ما تمسحه
  });
}
function refreshLineTotalOnly(rowId){
  const item = state.items.find(it=>it.rowId===rowId);
  const row = [...document.querySelectorAll('.item-row')].find(r=> r.querySelector('.remove-btn').dataset.row == rowId);
  if(row){ row.querySelector('.line-total-input').value = fmt(lineTotal(item)); }
}

/* ================= TOTALS / PAYMENT ================= */
function updateTotals(){
  const total = grandTotal();
  document.getElementById('grandTotalVal').textContent = fmt(total);
  updateSaveEnabled();
}
function toggleTotalsSection(){
  const isTransfer = state.type === 'transfer';
  document.getElementById('totalsSection').classList.toggle('hidden', isTransfer);
}
function updateSaveEnabled(){
  const isTransfer = state.type === 'transfer';
  const hasItems = state.items.length > 0 && state.items.some(it=> it.productId!=null && it.qty > 0);

  if(isTransfer){
    document.getElementById('saveBtn').disabled = !hasItems;
    saveDraft();
    return;
  }

  const total = grandTotal();
  const sum = paySum();
  const diff = Math.round((total - sum) * 100) / 100;
  const banner = document.getElementById('matchBanner');
  let matched = Math.abs(diff) < 0.01 && total > 0;

  if(total <= 0){
    banner.className = 'match-banner bad';
    banner.textContent = 'أضف أصناف الفاتورة أولاً';
  } else if(diff > 0){
    banner.className = 'match-banner bad';
    banner.textContent = `متبقي ${fmt(diff)} لسه محطوطش في طريقة دفع`;
  } else if(diff < 0){
    banner.className = 'match-banner bad';
    banner.textContent = `في زيادة ${fmt(Math.abs(diff))} عن إجمالي الفاتورة`;
  } else {
    banner.className = 'match-banner ok';
    banner.textContent = 'مطابق ✓ إجمالي طرق الدفع = إجمالي الفاتورة';
  }
  document.getElementById('saveBtn').disabled = !(matched && hasItems);
  refreshQuickPayHighlight();
  saveDraft();
}
['payVodafone','payCash','payCredit'].forEach((id,idx)=>{
  const keyMap = {payVodafone:'vodafone', payCash:'cash', payCredit:'credit'};
});
document.getElementById('payVodafone').addEventListener('input', e=>{ state.pay.vodafone = Number(e.target.value)||0; refreshQuickPayHighlight(); updateSaveEnabled(); });
document.getElementById('payCash').addEventListener('input', e=>{ state.pay.cash = Number(e.target.value)||0; refreshQuickPayHighlight(); updateSaveEnabled(); });
document.getElementById('payCredit').addEventListener('input', e=>{ state.pay.credit = Number(e.target.value)||0; refreshQuickPayHighlight(); updateSaveEnabled(); });

/* أزرار "الكل نقدي / فودافون / آجل" — تحط إجمالي الفاتورة كله على طريقة دفع واحدة بدوسة واحدة */
document.querySelectorAll('.quick-pay-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const method = btn.dataset.method; // 'cash' | 'vodafone' | 'credit'
    const total = grandTotal();
    state.pay = {vodafone:0, cash:0, credit:0};
    state.pay[method] = total;
    document.getElementById('payVodafone').value = state.pay.vodafone || "";
    document.getElementById('payCash').value = state.pay.cash || "";
    document.getElementById('payCredit').value = state.pay.credit || "";
    refreshQuickPayHighlight();
    updateSaveEnabled();
  });
});
function refreshQuickPayHighlight(){
  const total = grandTotal();
  document.querySelectorAll('.quick-pay-btn').forEach(btn=>{
    const method = btn.dataset.method;
    const isFullyOnThisMethod = total > 0 && Math.abs((Number(state.pay[method])||0) - total) < 0.01
      && (Object.keys(state.pay).filter(k=>k!==method).every(k=> !(Number(state.pay[k])||0)));
    btn.dataset.active = isFullyOnThisMethod ? "true" : "false";
  });
}

/* ================= RESET / SAVE ================= */
function resetForm(){
  state = {type: state.type, party:"", fromStore:"", toStore:"", note:"", items:[], pay:{vodafone:0,cash:0,credit:0}};
  document.getElementById('payVodafone').value = "";
  document.getElementById('payCash').value = "";
  document.getElementById('payCredit').value = "";
  renderPartyCard();
  renderItems();
  toggleTotalsSection();
  updateTotals();
  clearDraft();
}
document.getElementById('resetBtn').addEventListener('click', resetForm);
document.getElementById('addItemBtn').addEventListener('click', addItemRow);

document.getElementById('saveBtn').addEventListener('click', async ()=>{
  const t = typeMeta(state.type);
  const num = await nextInvoiceNumber(state.type);
  const invoiceNumber = `${t.prefix}-${String(num).padStart(4,'0')}`;
  const shopName = document.getElementById('shopNameInput').value || "الصياد";
  const invoice = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
    number: invoiceNumber,
    type: state.type,
    shopName,
    party: state.party,
    fromStore: state.fromStore,
    toStore: state.toStore,
    note: state.note,
    items: state.items.map(it=>{
      const p = PRODUCTS.find(pp=>pp.id===it.productId);
      return {name: p?p.name:"صنف", unit: it.unit, qty: it.qty, price: it.price, total: lineTotal(it)};
    }),
    total: grandTotal(),
    pay: {...state.pay},
    date: new Date().toLocaleDateString('ar-EG'),
    createdAt: Date.now()
  };
  const ok = await saveInvoiceToStorage(invoice);
  showToast(ok ? 'تم حفظ الفاتورة' : 'الفاتورة اتحفظت مؤقت بس حصلت مشكلة في التخزين');
  resetForm();
  openReceipt(invoice);
});

function showToast(msg){
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=> el.remove(), 2200);
}

/* ================= NAVIGATION ================= */
function showScreen(name){
  document.getElementById('screenNew').classList.toggle('hidden', name!=='new');
  document.getElementById('screenList').classList.toggle('hidden', name!=='list');
  document.getElementById('screenReceipt').classList.toggle('hidden', name!=='receipt');
}
document.getElementById('navListBtn').addEventListener('click', async ()=>{
  showScreen('list');
  await renderInvoiceList();
});
document.getElementById('backToNewBtn').addEventListener('click', ()=> showScreen('new'));
document.getElementById('backFromReceiptBtn').addEventListener('click', async ()=>{
  showScreen('list');
  await renderInvoiceList();
});

async function renderInvoiceList(){
  const wrap = document.getElementById('invoiceListWrap');
  wrap.innerHTML = `<div class="empty-state">جارِ التحميل...</div>`;
  const invoices = await listInvoices();
  if(invoices.length===0){
    wrap.innerHTML = `<div class="empty-state">لسه مفيش فواتير محفوظة</div>`;
    return;
  }
  wrap.innerHTML = "";
  invoices.forEach(inv=>{
    const t = typeMeta(inv.type);
    const partyText = inv.type==='transfer' ? `${inv.fromStore||'—'} ← ${inv.toStore||'—'}` : (inv.party || '—');
    const rightVal = inv.type==='transfer' ? `${inv.items.reduce((s,it)=>s+(Number(it.qty)||0),0)} قطعة/دستة` : fmt(inv.total);
    const el = document.createElement('div');
    el.className = 'inv-card';
    el.innerHTML = `
      <div class="inv-badge ${inv.type}"></div>
      <div class="inv-info">
        <div class="top"><span>${inv.number}</span><span>${rightVal}</span></div>
        <div class="bottom"><span>${partyText}</span><span>${inv.date}</span></div>
      </div>
    `;
    el.addEventListener('click', ()=> openReceipt(inv));
    wrap.appendChild(el);
  });
}

/* ================= RECEIPT VIEW ================= */
function openReceipt(invoice){
  currentReceiptInvoiceId = invoice.id;
  const t = typeMeta(invoice.type);
  const isTransfer = invoice.type === 'transfer';
  const partyLine = invoice.type==='transfer'
    ? `من: ${invoice.fromStore||'—'} &nbsp;&nbsp;→&nbsp;&nbsp; إلى: ${invoice.toStore||'—'}`
    : (invoice.party ? `${t.partyLabel}: ${invoice.party}` : "");

  const rows = invoice.items.map(it=> isTransfer ? `
    <tr>
      <td>${it.name}</td>
      <td>${it.unit==='dozen'?'دستة':'قطعة'}</td>
      <td class="num">${it.qty}</td>
    </tr>
  ` : `
    <tr>
      <td>${it.name}</td>
      <td>${it.unit==='dozen'?'دستة':'قطعة'}</td>
      <td class="num">${it.qty}</td>
      <td class="num">${fmt(it.price)}</td>
      <td class="num">${fmt(it.total)}</td>
    </tr>
  `).join("");

  const payRows = [];
  if(!isTransfer){
    if(Number(invoice.pay.vodafone)>0) payRows.push(`<div class="row"><span>فودافون كاش</span><span>${fmt(invoice.pay.vodafone)}</span></div>`);
    if(Number(invoice.pay.cash)>0) payRows.push(`<div class="row"><span>نقدي</span><span>${fmt(invoice.pay.cash)}</span></div>`);
    if(Number(invoice.pay.credit)>0) payRows.push(`<div class="row"><span>آجل</span><span>${fmt(invoice.pay.credit)}</span></div>`);
  }

  document.getElementById('receipt').innerHTML = `
    <img class="r-logo" src="${SHOP_LOGO}" alt="الصياد">
    <div class="r-shop">${invoice.shopName}</div>
    <div class="r-center"><span class="r-type-badge ${invoice.type}">${t.label}</span></div>
    <div class="r-meta"><span>رقم: ${invoice.number}</span><span>${invoice.date}</span></div>
    ${partyLine ? `<div class="r-party">${partyLine}</div>` : ""}
    <table class="r-table">
      <thead><tr><th>الصنف</th><th>الوحدة</th><th class="num">الكمية</th>${isTransfer?"":'<th class="num">السعر</th><th class="num">الإجمالي</th>'}</tr></thead>
      <tbody>${rows}</tbody>
    </table>
    ${isTransfer ? "" : `
    <div class="r-totals">
      ${payRows.join("")}
      <div class="row grand"><span>الإجمالي الكلي</span><span>${fmt(invoice.total)}</span></div>
    </div>`}
    ${invoice.note ? `<div class="r-footer">${invoice.note}</div>` : ""}
    <div class="r-footer">شكراً لتعاملكم معنا</div>
  `;
  showScreen('receipt');
}

document.getElementById('deleteInvoiceBtn').addEventListener('click', async ()=>{
  if(!currentReceiptInvoiceId) return;
  if(!confirm('حذف الفاتورة دي؟')) return;
  await deleteInvoiceFromStorage(currentReceiptInvoiceId);
  showScreen('list');
  renderInvoiceList();
});

document.getElementById('shareImgBtn').addEventListener('click', async ()=>{
  const target = document.getElementById('receipt');
  const btn = document.getElementById('shareImgBtn');
  btn.disabled = true;
  const originalText = btn.textContent;
  btn.textContent = "جارِ التجهيز...";
  try{
    const canvas = await html2canvas(target, {backgroundColor:'#ffffff', scale:2});
    canvas.toBlob(async (blob)=>{
      const fileName = `فاتورة-${Date.now()}.png`;
      const file = new File([blob], fileName, {type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        try{
          await navigator.share({files:[file], title:'فاتورة'});
        }catch(e){ /* user cancelled share */ }
      } else {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = fileName;
        document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(url);
        showToast('اتحملت الصورة');
      }
      btn.disabled = false; btn.textContent = originalText;
    }, 'image/png');
  }catch(e){
    showToast('حصلت مشكلة في تجهيز الصورة');
    btn.disabled = false; btn.textContent = originalText;
  }
});

/* ================= INIT ================= */
document.getElementById('shopNameInput').addEventListener('blur', e=> saveShopName(e.target.value));
loadShopName();
async function init(){
  const draft = await loadDraft();
  if(draft && draft.state && Array.isArray(draft.state.items) && draft.state.items.length > 0){
    state = draft.state;
    rowSeq = draft.rowSeq || (Math.max(0,...state.items.map(it=>it.rowId)) + 1);
    renderTypeGrid();
    renderPartyCard();
    renderItems();
    document.getElementById('payVodafone').value = state.pay.vodafone || "";
    document.getElementById('payCash').value = state.pay.cash || "";
    document.getElementById('payCredit').value = state.pay.credit || "";
    toggleTotalsSection();
    updateTotals();
    showToast('كملنا من الفاتورة اللي كانت شغالة');
  } else {
    renderTypeGrid();
    renderPartyCard();
    addItemRow();
    toggleTotalsSection();
    updateTotals();
  }
}
init();
